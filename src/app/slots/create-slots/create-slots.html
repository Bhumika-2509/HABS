<div>
    <div>All Slots</div>
    <table border="1" cellspacing="0" cellpadding="8">
        <thead>
            <tr>
                <td>S.No</td>
                <td>Slot Time</td>
                <td>Status</td>
            </tr>
        </thead>
        <tbody *ngFor="let slot of allAvlSlots; let i = index">
            <tr>
                <td>{{ i + 1}}</td>
                <td>{{ slot.slotTime }}</td>
                <td>{{ slot.status }}</td>
            </tr>
        </tbody>
    </table>
</div>
<div style="padding: 5px 20px;">
    <div (click)="handleAddNewSlotClick()" class="createNewSlotBtn">Create New Slot</div>
</div>


<div *ngIf="showCreateNewSlot">
    <div>
        <div class="label">Slot Time</div>
        <input type="text" [(ngModel)]="slotTime" />
    </div>
    <div>
        <div class="label">Status</div>
        <input type="text" [(ngModel)]="status" />
    </div>
    <div style="padding: 5px 0px;">
        <div (click)="onSubmit()" class="submitBtn">Submit</div>
    </div>
</div>
